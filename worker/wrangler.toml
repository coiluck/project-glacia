name = "project-glacia-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# wrangler d1 create project-glacia で作り、出てきた database_id を貼る
[[d1_databases]]
binding = "DB"
database_name = "project-glacia"
database_id = "f8009b8c-9014-48f5-8bae-cfc19b48bf8d"

# コマンドをユーザーごとに1本ずつ流す（worker/src/userQueue.ts）
# 無料プランは SQLite 版のクラスしか作れないので new_sqlite_classes。ストレージ自体は使わない
[[durable_objects.bindings]]
name = "USER_QUEUE"
class_name = "UserQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserQueue"]

# Workers Logs。console.log をダッシュボードで検索できるようにする
# 不正の跡（router.ts の unknown_path、userQueue.ts の rejected）を見るのに使う
[observability]
enabled = true

# vite.config.ts の proxy 先と揃える。空いていなければ起動時に失敗させる
[dev]
port = 8787

# CORS の許可元。カンマ区切りで複数書ける
[vars]
ALLOWED_ORIGIN = "http://localhost:5173,https://coiluck.github.io,https://coiluck.moe"

# secret（ここには書かない）
#   PASSWORD_PEPPER … パスワードハッシュの鍵。`npx wrangler secret put PASSWORD_PEPPER`
#                     ローカルは worker/.dev.vars。失うと全ユーザーがログイン不能になる
