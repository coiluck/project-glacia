<!doctype html>
<!-- イベントバナーの元。render.py で同名の .avif に書き出し、public/images/events/ にコピーして使う -->
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .banner { --accent: #f2c46b; --badge-ink: #3a2600; }
  .bg { background-image: url('../public/images/top/ice_port.jpg'); background-position: 75% 45%; background-size: 120% auto; }
  .bg-grade { background: linear-gradient(to top, rgba(4, 30, 44, 0.65), transparent 45%); }
  .panel { background: linear-gradient(100deg, rgba(4, 34, 52, 0.84) 0%, rgba(6, 44, 66, 0.55) 60%, rgba(6, 44, 66, 0.25) 100%); }
  .panel-edge { background: var(--accent); }
  .hexes { -webkit-mask-image: radial-gradient(ellipse 520px 300px at 0% 100%, #000, transparent); }
  .title { font-size: 128px; }
  .c-lapis { width: 560px; left: 610px; top: -50px; }

  /* 品物の札 */
  .goods { position: absolute; inset: 0; pointer-events: none; }
  .good {
    position: absolute;
    width: 92px;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.95), rgba(214, 236, 245, 0.9));
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
  }
  .good::after {
    content: '';
    position: absolute;
    inset: 4px;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    border: 0;
    background: transparent;
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .good svg { width: 54px; height: 54px; }
  .good path { fill: none; stroke: #0d3a52; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
</style></head>
<body>
<div class="banner">
  <div class="bg"></div>
  <div class="bg-grade"></div>
  <img class="chara c-lapis" src="../public/images/character/full_body/lapis.png">
  <div class="goods">
    <div class="good" style="left: 640px; top: 50px; transform: scale(0.85) rotate(-6deg);"><svg viewBox="0 0 24 24"><path d="M10.8 2.2 16 7.4 13.6 19.8 8.6 18 5.4 9.4Z M10.8 2.2 10.4 12.4 5.4 9.4 M10.4 12.4 16 7.4 M10.4 12.4 8.6 18 M4.6 15.6 7.2 17.4 6 20.8Z"/></svg></div>
    <div class="good" style="left: 590px; top: 260px; transform: rotate(4deg);"><svg viewBox="0 0 24 24"><path d="M18.11 9.78 20.8 10.13V13.87L18.11 14.22 16.98 16.18 18.02 18.69 14.78 20.56 13.13 18.4 11.6 15.6 9.4 17.2 7.02 16.18 5.89 14.22 3.2 13.87V10.13L5.89 9.78 7.02 7.82 5.98 5.31 9.22 3.44 10.87 5.6 13.13 5.6 14.78 3.44 18.02 5.31 16.98 7.82Z M15.2 12 13.6 14.77H10.4L8.8 12 10.4 9.23H13.6Z"/></svg></div>
    <div class="good" style="left: 990px; top: 60px; transform: scale(0.8) rotate(6deg);"><svg viewBox="0 0 24 24"><path d="M12 20.8v-8.4 M12 12.4 7.2 8.8 5.6 3.4l5.4 3.4 1 5.6 M12 12.4 16.8 8.8 18.4 3.4 13 6.8l-1 5.6 M9.2 14.6h5.6l-.6 3.4H9.8Z M9.4 16.2h5.2"/></svg></div>
    <div class="good" style="left: 1040px; top: 270px; transform: scale(0.95) rotate(-4deg);"><svg viewBox="0 0 24 24"><path d="M7.2 9.6h9.6l3.2 7.8H4Z M7.2 9.6 6 17.4 M16.8 9.6l1.2 7.8 M9.4 5.8h5.2l1.8 3.6H7.6Z M10.8 12.4h2.4l-.8 2.8h-1.6Z"/></svg></div>
  </div>
    <div class="panel"></div>
  <div class="panel-edge"></div>
  <div class="hexes" data-r="40" data-color="rgba(140,230,240,0.22)"></div>
  <div class="flare"></div>
  <div class="snow" data-n="60"></div>
  <div class="text">
    <div class="kicker"><span class="badge">解放</span>新機能</div>
    <div class="title">交換所</div>
    <div class="sub">品揃えは毎日入れ替わり</div>
  </div>
  <div class="frame"></div>
</div>
<script src="deco.js"></script>
</body></html>
