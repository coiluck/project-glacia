<!doctype html>
<!-- イベントバナーの元。render.py で同名の .avif に書き出し、public/images/events/ にコピーして使う -->
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .banner { --accent: #ffb35c; --badge-ink: #3a1c00; }
  .bg { background-image: url('../public/images/scenario/bg/camp_tent.png'); background-position: 80% 60%; background-size: 125% auto; }
  .bg-grade {
    background:
      linear-gradient(to top, rgba(14, 18, 34, 0.7), transparent 45%),
      radial-gradient(ellipse 420px 320px at 98% 70%, rgba(255, 150, 60, 0.35), transparent 70%);
  }
  .panel { background: linear-gradient(100deg, rgba(14, 22, 44, 0.84) 0%, rgba(20, 30, 58, 0.55) 60%, rgba(20, 30, 58, 0.25) 100%); }
  .panel-edge { background: var(--accent); }
  .hexes { -webkit-mask-image: radial-gradient(ellipse 520px 300px at 0% 100%, #000, transparent); }
  .title { font-size: 128px; }
  .c-clarice { width: 540px; left: 660px; top: -50px; }
  /* 床に広がる六角の区画 */
  .colony {
    position: absolute;
    left: 330px;
    top: 300px;
    width: 700px;
    height: 400px;
    transform: perspective(700px) rotateX(62deg) scale(0.8);
    transform-origin: 50% 0;
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 40%, #000 40%, transparent 100%);
  }
  .colony svg { width: 100%; height: 100%; overflow: visible; }
  .flare {
    background:
      radial-gradient(ellipse 380px 260px at 100% 72%, rgba(255, 170, 80, 0.5), transparent 70%),
      radial-gradient(ellipse 300px 120px at 62% 92%, rgba(255, 160, 70, 0.4), transparent 70%);
  }
</style></head>
<body>
<div class="banner">
  <div class="bg"></div>
  <div class="bg-grade"></div>
