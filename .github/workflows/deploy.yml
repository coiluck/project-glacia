# main への push で GitHub Pages に公開する
# 事前に Settings > Pages の Source を「GitHub Actions」にし、
# Settings > Secrets and variables > Actions > Variables に VITE_API_BASE_URL（Worker の URL）を入れておく
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check VITE_API_BASE_URL
        run: test -n "$VITE_API_BASE_URL" || (echo "::error::リポジトリ変数 VITE_API_BASE_URL が未設定" && exit 1)

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
